name: hoginote
description: Hoginote — офлайн-плеер для музыки из YouTube. Без регистрации. Без сбора данных.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  youtube_explode_dart: ^2.3.4
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.11
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.0
  provider: ^6.1.0
  xml: ^6.5.0
  url_launcher: ^6.2.4
  # Для desktop-сборки (Windows/macOS/Linux) раскомментировать:
  # sqflite_common_ffi: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
